<meta charset="UTF-8">

<title>Program Details — Study in Germany</title>
<style>
:root{
  --bg:#0b0f19;
  --bg-gradient: radial-gradient(circle at 50% 0%, #17233f 0%, #0b0f19 75%);
  --panel: rgba(22, 29, 49, 0.72);
  --panel-solid: #151d30;
  --panel2: rgba(30, 41, 67, 0.65);
  --border: rgba(91, 140, 255, 0.16);
  --border-light: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(91, 140, 255, 0.45);
  --text: #f0f4fc;
  --muted: #9bb0d3;
  --accent: #5b8cff;
  --accent-glow: rgba(91, 140, 255, 0.25);
  --good: #38ef7d;
  --warn: #ffb74d;
  --bad: #ff5252;
  --radius: 16px;
  --radius-sm: 10px;
  --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  --backdrop: blur(14px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg: #f5f8ff;
    --bg-gradient: radial-gradient(circle at 50% 0%, #e2ecff 0%, #f5f8ff 75%);
    --panel: rgba(255, 255, 255, 0.82);
    --panel-solid: #ffffff;
    --panel2: rgba(238, 244, 255, 0.75);
    --border: rgba(53, 95, 214, 0.15);
    --border-light: rgba(0, 0, 0, 0.06);
    --border-hover: rgba(53, 95, 214, 0.4);
    --text: #172033;
    --muted: #5e6f8d;
    --accent: #2e62ea;
    --accent-glow: rgba(46, 98, 234, 0.18);
    --good: #00b862;
    --warn: #e67e22;
    --bad: #e74c3c;
    --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
  }
}
:root[data-theme="light"]{
  --bg: #f5f8ff;
  --bg-gradient: radial-gradient(circle at 50% 0%, #e2ecff 0%, #f5f8ff 75%);
  --panel: rgba(255, 255, 255, 0.82);
  --panel-solid: #ffffff;
  --panel2: rgba(238, 244, 255, 0.75);
  --border: rgba(53, 95, 214, 0.15);
  --border-light: rgba(0, 0, 0, 0.06);
  --border-hover: rgba(53, 95, 214, 0.4);
  --text: #172033;
  --muted: #5e6f8d;
  --accent: #2e62ea;
  --accent-glow: rgba(46, 98, 234, 0.18);
  --good: #00b862;
  --warn: #e67e22;
  --bad: #e74c3c;
  --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color:var(--text);
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  line-height:1.6;
  min-height: 100vh;
}
.container{max-width:95%;margin:0 auto;padding:26px 12px 80px;}
.top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.back{
  color:var(--accent);
  text-decoration:none;
  font-size:.88rem;
  font-weight:700;
  background: var(--panel);
  backdrop-filter: var(--backdrop);
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  box-shadow: var(--glass-shadow);
  transition: all .2s;
}
.back:hover{
  transform: translateX(-3px);
  border-color: var(--accent);
}
.themebtn{
  background:var(--panel);
  backdrop-filter: var(--backdrop);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 14px;
  border-radius:20px;
  font-size:.8rem;
  cursor:pointer;
  box-shadow: var(--glass-shadow);
}

.header-card{
  background:var(--panel);
  backdrop-filter: var(--backdrop);
  -webkit-backdrop-filter: var(--backdrop);
  border:1px solid var(--border);
  box-shadow: var(--glass-shadow);
  border-radius:var(--radius);
  padding:26px;
  margin-bottom:22px;
}
.uni{
  color:var(--accent);
  font-weight:800;
  font-size:.85rem;
  text-transform:uppercase;
  letter-spacing:.04em;
}
h1{
  font-size:1.65rem;
  font-weight: 800;
  margin:8px 0 16px;
  background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.tags{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.tag{
  font-size:.72rem;
  padding:5px 12px;
  border-radius:12px;
  font-weight:700;
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}
.tier-A{background:rgba(56,239,125,.16);color:var(--good);border:1px solid rgba(56,239,125,.3);}
.tier-B{background:rgba(255,183,77,.16);color:var(--warn);border:1px solid rgba(255,183,77,.3);}
.tier-C{background:rgba(155,176,211,.16);color:var(--muted);border:1px solid rgba(155,176,211,.25);}
.tier-D{background:rgba(91,140,255,.16);color:var(--accent);border:1px solid rgba(91,140,255,.3);}
.fit-good{background:rgba(56,239,125,.18);color:var(--good);border:1px solid rgba(56,239,125,.35);}
.fit-moderate,.fit-borderline{background:rgba(255,183,77,.18);color:var(--warn);border:1px solid rgba(255,183,77,.35);}
.fit-risky,.fit-weak{background:rgba(255,82,82,.18);color:var(--bad);border:1px solid rgba(255,82,82,.35);}
.fit-unknown,.fit-unclear{background:rgba(155,176,211,.16);color:var(--muted);border:1px solid rgba(155,176,211,.25);}

/* Section Navigation Tabs */
.tabs-nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding: 10px 4px 12px;
  margin-bottom:22px;
  position:sticky;
  top:0;
  background: transparent;
  z-index:10;
}
.tab-btn{
  background:var(--panel);
  backdrop-filter: var(--backdrop);
  border:1px solid var(--border);
  color:var(--text);
  padding:9px 16px;
  border-radius:14px;
  font-size:.82rem;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  transition:all .18s ease;
  box-shadow: var(--glass-shadow);
}
.tab-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
  transform: translateY(-2px);
}
.tab-btn.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
  box-shadow: 0 4px 14px var(--accent-glow);
}

/* Section Layout */
.section-block{
  background: transparent;
  border: none;
  box-shadow: none;
  padding: 0;
  margin-bottom: 28px;
  scroll-margin-top: 76px;
}
.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:1.18rem;
  font-weight:800;
  color:var(--text);
  border-bottom:1px solid var(--border);
  padding-bottom:12px;
  margin-top:0;
  margin-bottom:18px;
}
.section-title span.icon{font-size:1.35rem;}

.grid-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:16px;}
.info-item{
  background:var(--panel2);
  border:1px solid var(--border-light);
  border-radius:var(--radius-sm);
  padding:12px 15px;
  transition: border-color .15s;
  min-width: 0;
  overflow-wrap: break-word;
  word-break: break-word;
}
.info-item:hover{
  border-color: var(--border-hover);
}
.info-item b{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;font-weight:700;}
.info-item .val{font-size:.9rem;font-weight:600;overflow-wrap:break-word;word-break:break-word;}

.longbox{
  background:var(--panel2);
  border:1px solid var(--border-light);
  border-radius:var(--radius-sm);
  padding:16px 18px;
  font-size:.88rem;
  line-height:1.75;
  margin-bottom:14px;
  white-space:pre-line;
  overflow-wrap: break-word;
  word-break: break-word;
  max-width: 100%;
}
.longbox.empty{color:var(--muted);font-style:italic;}

.note-box{
  background:rgba(91,140,255,.1);
  border-left:4px solid var(--accent);
  padding:14px 18px;
  border-radius:8px;
  font-size:.88rem;
  line-height:1.65;
  margin-bottom:16px;
  overflow-wrap: break-word;
  word-break: break-word;
  max-width: 100%;
}
.note-box.fit{background:rgba(255,183,77,.1);border-left-color:var(--warn);}
.note-box.good{background:rgba(56,239,125,.1);border-left-color:var(--good);}
.note-box.bad{background:rgba(255,82,82,.1);border-left-color:var(--bad);}

@media (max-width: 768px) {
  .container{max-width:100%;padding:16px 10px 60px;}
  .header-card{padding:16px 14px;}
  h1{font-size:1.35rem;}
  .grid-info{grid-template-columns:1fr;gap:10px;}
  .section-title{font-size:1.05rem;}
  .quick-links{flex-direction:column;}
  .quick-btn{width:100%;justify-content:center;box-sizing:border-box;}
  .tags{gap:6px;}
  .tag{font-size:.68rem;padding:4px 9px;}
  .tab-btn{padding:7px 12px;font-size:.76rem;}
  .info-item{padding:10px 12px;}
  .longbox{padding:12px 14px;font-size:.84rem;}
}
.note-box.good{background:rgba(56,239,125,.1);border-left-color:var(--good);}

.quick-links{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
.quick-btn{
  background:var(--accent);
  color:#fff;
  text-decoration:none;
  padding:9px 18px;
  border-radius:12px;
  font-size:.85rem;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:6px;
  box-shadow: 0 4px 14px var(--accent-glow);
  transition: all .2s;
}
.quick-btn:hover{
  transform: translateY(-2px);
  box-shadow: 0 6px 20px var(--accent-glow);
}
.quick-btn.secondary{
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  box-shadow: var(--glass-shadow);
}
.quick-btn.secondary:hover{
  border-color: var(--accent);
  color: var(--accent);
}
.section-title{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
.src-tag{
  font-size:.68rem;
  font-weight:700;
  padding:3px 9px;
  border-radius:10px;
  text-decoration:none;
  white-space:nowrap;
}
.src-tag.daad{ background:rgba(91,140,255,.12); color:var(--accent); border:1px solid rgba(91,140,255,.3); }
.src-tag.official{ background:rgba(62,207,142,.12); color:var(--good); border:1px solid rgba(62,207,142,.3); }
.gpa-src-link{ font-size:.72rem; margin-left:8px; text-decoration:none; color:var(--danger); font-weight:600; }
</style>

<div class="container" id="root">
  <div style="padding:40px;text-align:center;">তথ্য লোড হচ্ছে...</div>
</div>

<script src="germany_database.js"></script>
<script src="canada_database.js"></script>
<script>
(function(){
  const saved = localStorage.getItem('study_abroad_theme');
  if(saved){
    document.documentElement.setAttribute('data-theme', saved);
  }
})();
function toggleTheme(){
  const html = document.documentElement;
  const current = html.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const next = current === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('study_abroad_theme', next);
}

const params = new URLSearchParams(location.search);
const progId = params.get('id');
const paramIdx = parseInt(params.get('i'), 10);
const source = params.get('s');
const root = document.getElementById('root');

function nf(v){ return (v===undefined || v===null || v==="" || v==="Not found") ? "<span style='color:var(--muted);font-style:italic;'>Not found</span>" : v; }

// Combined dataset across all countries — same program `id`s stay unique per country database.
const ALL_PROGRAMS = []
  .concat((typeof GERMANY_DB !== 'undefined' && GERMANY_DB.programs) ? GERMANY_DB.programs : [])
  .concat((typeof CANADA_DB !== 'undefined' && CANADA_DB.programs) ? CANADA_DB.programs : []);

// Single Source of Truth Resolution
let prog = null;
if (ALL_PROGRAMS.length) {
  if (progId) {
    prog = ALL_PROGRAMS.find(p => p.id === progId);
  }
  if (!prog && source === 'daad') {
    prog = ALL_PROGRAMS.find(p => p.daad_id == paramIdx) || ALL_PROGRAMS[paramIdx];
  }
  if (!prog && !isNaN(paramIdx)) {
    prog = ALL_PROGRAMS[paramIdx];
  }
}

if (!prog) {
  root.innerHTML = `
    <div class="top-nav"><a class="back" href="index.html">← মূল তালিকায় ফিরে যান</a></div>
    <div class="header-card"><h2>প্রোগ্রামটি পাওয়া যায়নি।</h2><p>দয়া করে তালিকা থেকে পুনরায় সিলেক্ট করুন।</p></div>
  `;
} else {
  const o = prog.overview || {};
  const c = prog.course_details || {};
  const f = prog.costs_funding || {};
  const r = prog.requirements_registration || {};
  const s = prog.services || {};
  const a = prog.about_university || {};

  const daadUrl = (a.source_url && a.source_url.startsWith('http')) ? a.source_url : null;
  const officialUrl = (prog.official_website_data && prog.official_website_data.official_source_url) ? prog.official_website_data.official_source_url : null;
  const spoUrl = (prog.official_website_data && prog.official_website_data.official_spo_pdf) ? prog.official_website_data.official_spo_pdf : null;
  const daadTag = daadUrl ? `<a class="src-tag daad" href="${daadUrl}" target="_blank" rel="noopener">🔗 সোর্স: DAAD পেজ</a>` : `<span class="src-tag daad" style="opacity:.5;">🔗 DAAD সোর্স নেই</span>`;
  const officialTag = officialUrl ? `<a class="src-tag official" href="${officialUrl}" target="_blank" rel="noopener">🔗 সোর্স: ইউনিভার্সিটির অফিসিয়াল পেজ</a>` : `<span class="src-tag official" style="opacity:.5;">🔗 অফিসিয়াল সোর্স নেই</span>`;
  const gpaSrcTag = spoUrl ? `<a class="gpa-src-link" href="${spoUrl}" target="_blank" rel="noopener">📄 সোর্স: SPO/PO রেগুলেশন PDF ↗</a>` : (officialUrl ? `<a class="gpa-src-link" href="${officialUrl}" target="_blank" rel="noopener">📄 সোর্স: অফিসিয়াল পেজ ↗</a>` : '');

  // ===== Personalized Fit Analysis =====
  // Candidate profile (assumed/confirmed by user)
  const CAND = {
    cgpaUS: 2.83,
    germanGrade: 2.76, // modified Bavarian formula, Nmin=2.00 (NSU's own minimum graduating CGPA)
    ielts: 6.5,
    workExpYears: 2
  };

  function collectText(obj){
    if (!obj) return '';
    if (typeof obj === 'string') return obj + ' ';
    if (Array.isArray(obj)) return obj.map(collectText).join(' ');
    if (typeof obj === 'object') return Object.values(obj).map(collectText).join(' ');
    return '';
  }

  const owd = prog.official_website_data || {};
  const gpaTextPool = [
    r.gpa_requirement, r.academic_requirements,
    owd.admission_eligibility && owd.admission_eligibility.minimum_gpa_cutoff,
    owd.gpa_conversion_benchmark,
    owd.deep_recheck && owd.deep_recheck.gpa_requirement_verified,
    owd.verification && collectText(owd.verification.discrepancies)
  ].filter(Boolean).join(' | ');

  const ieltsTextPool = [
    r.ielts,
    owd.language_requirements && owd.language_requirements.ielts,
    owd.deep_recheck && owd.deep_recheck.language_requirements_verified,
    owd.gap_fill_pass && collectText(owd.gap_fill_pass.fields_resolved)
  ].filter(Boolean).join(' | ');

  const workExpTextPool = [
    r.work_exp_note,
    owd.admission_eligibility && owd.admission_eligibility.work_experience,
    owd.deep_recheck && owd.deep_recheck.notes
  ].filter(Boolean).join(' | ');

  // --- GPA check ---
  let gpaStatus = 'unknown', gpaDetail = 'এই প্রোগ্রামের জন্য কোনো নির্দিষ্ট GPA cutoff সংখ্যা পাওয়া যায়নি সোর্স ডেটায় — academic_requirements সেকশনে বিস্তারিত পড়ে দেখো।';
  const gpaNoCutoffRe = /no (?:fixed |hard |numeric |minimum )?(?:gpa|grade)|without admission restriction|zulassungsfrei|no cutoff|aptitude (?:test|assessment)|holistic/i;
  const gpaNumMatch = gpaTextPool.match(/(?:grade|gpa)[^0-9]{0,25}?([1-4]\.\d)|([1-4]\.\d)\s*(?:or (?:better|higher)|\(german)/i);
  if (gpaNumMatch) {
    const cutoff = parseFloat(gpaNumMatch[1] || gpaNumMatch[2]);
    if (cutoff >= 1.0 && cutoff <= 4.0) {
      if (CAND.germanGrade <= cutoff + 0.05) {
        gpaStatus = 'good';
        gpaDetail = `প্রোগ্রামের cutoff ≈ German ${cutoff.toFixed(1)}, তোমার German grade ≈ ${CAND.germanGrade} — <b>শর্ত পূরণ হচ্ছে ✅</b>`;
      } else {
        gpaStatus = 'bad';
        gpaDetail = `প্রোগ্রামের cutoff ≈ German ${cutoff.toFixed(1)}, তোমার German grade ≈ ${CAND.germanGrade} — <b style="color:var(--bad);">cutoff-এর চেয়ে দুর্বল (সংখ্যায়), তবে অনেক প্রোগ্রাম কাজের অভিজ্ঞতা/SOP দিয়ে এটা offset করে বিবেচনা করে।</b>`;
      }
    }
  } else if (gpaNoCutoffRe.test(gpaTextPool)) {
    gpaStatus = 'good';
    gpaDetail = 'কোনো হার্ড GPA cutoff নেই — holistic/aptitude-based assessment বা admission-restriction-free, তাই CGPA সংখ্যা দিয়ে বাদ পড়ার ঝুঁকি কম।';
  }

  // --- IELTS check ---
  let ieltsStatus = 'unknown', ieltsDetail = 'এই প্রোগ্রামের জন্য নির্দিষ্ট IELTS স্কোর পাওয়া যায়নি — Requirements সেকশনে চেক করো।';
  const ieltsNumMatch = ieltsTextPool.match(/ielts[^0-9]{0,15}?(\d\.\d|\d)/i);
  if (ieltsNumMatch) {
    const req = parseFloat(ieltsNumMatch[1]);
    if (req > 0 && req <= 9) {
      if (CAND.ielts >= req) {
        ieltsStatus = 'good';
        ieltsDetail = `প্রোগ্রাম চায় IELTS ${req.toFixed(1)}, তোমার ধরে নেওয়া স্কোর 6.5 — <b>শর্ত পূরণ হচ্ছে ✅</b>`;
      } else {
        ieltsStatus = 'bad';
        ieltsDetail = `প্রোগ্রাম চায় IELTS ${req.toFixed(1)}, তোমার ধরে নেওয়া স্কোর 6.5 — <b style="color:var(--bad);">কম পড়ছে (${(req-6.5).toFixed(1)} পয়েন্ট), আরেকটু বেশি স্কোর দরকার হতে পারে।</b>`;
      }
    }
  }

  // --- Work experience check ---
  let workStatus = 'neutral', workDetail = 'এই প্রোগ্রামে কাজের অভিজ্ঞতা সংক্রান্ত নির্দিষ্ট কোনো তথ্য পাওয়া যায়নি।';
  if (/not (?:mandatory|required)|no work experience|not legally mandatory/i.test(workExpTextPool)) {
    workDetail = 'কাজের অভিজ্ঞতা বাধ্যতামূলক না, তবে তোমার ২ বছরের RTL/UVM experience SOP-তে শক্তিশালী পয়েন্ট হিসেবে কাজ করবে।';
    workStatus = 'good';
  } else if (/required|mandatory|preferred|advantage|strongly recommended|give preference/i.test(workExpTextPool)) {
    workDetail = 'কাজের অভিজ্ঞতা দরকার/পছন্দনীয় বলে উল্লেখ আছে — তোমার ২ বছরের সরাসরি RTL Design & Verification experience এখানে স্পষ্ট সুবিধা দেবে। ✅';
    workStatus = 'good';
  } else {

      ${prog.official_website_data.curriculum_details ? `
      <div style="font-size:.85rem;font-weight:700;color:var(--accent);text-transform:uppercase;margin:20px 0 8px;border-bottom:1px solid var(--border);padding-bottom:4px;">
        📚 পূর্ণাঙ্গ মডিউল ক্যাটালগ ও কারিকুলাম (Module Breakdown):
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:12px;margin-bottom:16px;">
        ${(prog.official_website_data.curriculum_details.module_catalog || []).map(cat => `
          <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;">
            <div style="font-weight:700;color:var(--good);font-size:.85rem;margin-bottom:6px;border-bottom:1px dashed var(--border);padding-bottom:4px;">${cat.pillar}</div>
            <ul style="padding-left:16px;margin:0;font-size:.82rem;line-height:1.6;">
              ${(cat.modules || []).map(m => `<li>${m}</li>`).join('')}
            </ul>
          </div>
        `).join('')}
      </div>
      ` : `
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:12px;margin:16px 0;">
        ${(prog.official_website_data.official_modules_breakdown || []).map(cat => `
          <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;">
            <div style="font-weight:700;color:var(--accent);font-size:.88rem;margin-bottom:8px;border-bottom:1px dashed var(--border);padding-bottom:4px;">${cat.category}</div>
            <ul style="padding-left:16px;margin:0;font-size:.84rem;line-height:1.6;">
              ${(cat.modules || []).map(m => `<li>${m}</li>`).join('')}
            </ul>
          </div>
        `).join('')}
      </div>
      `}

      <!-- Direct Applicant Fit & Advice -->
      ${prog.official_website_data.bangladesh_applicant_fit ? `
      <div class="note-box ${prog.gpa_fit==='good'?'good':(prog.gpa_fit==='moderate'||prog.gpa_fit==='borderline'?'':'bad')}" style="margin-top:14px;font-size:.88rem;line-height:1.7;">
        🎯 <b>আপনার প্রোফাইল (2.8 CGPA / 2 Years RTL Experience) অনুযায়ী পরামর্শ:</b><br>
        <b>মূল্যায়ন:</b> ${prog.official_website_data.bangladesh_applicant_fit.gpa_verdict}<br>
        ${prog.official_website_data.bangladesh_applicant_fit.gpa_analysis}<br>
        👉 <b>করণীয় পদক্ষেপ:</b> ${prog.official_website_data.bangladesh_applicant_fit.actionable_recommendation}
      </div>
      ` : ""}

      ${prog.official_website_data.verification ? `
      <div style="margin-top:16px;background:rgba(255,200,87,.06);border:1px solid rgba(255,200,87,.3);border-radius:10px;padding:14px;">
        <div style="font-weight:700;font-size:.85rem;margin-bottom:8px;">Independent re-verification (${prog.official_website_data.verification.verified_on}) - status: ${prog.official_website_data.verification.status}</div>
        ${(prog.official_website_data.verification.discrepancies||[]).length ? `
        <ul style="padding-left:18px;margin:0 0 10px;font-size:.84rem;line-height:1.7;">
          ${prog.official_website_data.verification.discrepancies.map(d => '<li><b>' + d.field + ':</b> ' + d.corrected_value + ' <span style="color:var(--muted);">(previously: ' + d.old_value + ')</span></li>').join('')}
        </ul>` : ''}
        ${prog.official_website_data.verification.additional_info_found ? `<div style="font-size:.84rem;line-height:1.7;margin-bottom:8px;"><b>Additional info found:</b> ${prog.official_website_data.verification.additional_info_found}</div>` : ''}
        ${prog.official_website_data.verification.notes ? `<div style="font-size:.8rem;color:var(--muted);line-height:1.6;">${prog.official_website_data.verification.notes}</div>` : ''}
      </div>
      ` : ""}
${prog.official_website_data.deep_recheck ? `
      <div style="margin-top:16px;background:rgba(91,140,255,.05);border:1px solid rgba(91,140,255,.3);border-radius:10px;padding:14px;">
        <div style="font-weight:700;font-size:.85rem;margin-bottom:8px;">Deep multi-page recheck (${prog.official_website_data.deep_recheck.checked_on})</div>
        <div class="grid-info" style="margin-bottom:10px;">
          <div class="info-item"><b>VPD / uni-assist required?</b><div class="val" style="color:${(prog.official_website_data.deep_recheck.vpd_uni_assist_required||'').toLowerCase().startsWith('yes')?'var(--danger)':'var(--text)'};font-weight:700;">${prog.official_website_data.deep_recheck.vpd_uni_assist_required}</div></div>
          <div class="info-item"><b>Application Portal Detail</b><div class="val">${nf(prog.official_website_data.deep_recheck.application_portal_detail)}</div></div>
          <div class="info-item"><b>GPA (re-verified)</b><div class="val">${nf(prog.official_website_data.deep_recheck.gpa_requirement_verified)}</div></div>
          <div class="info-item"><b>Language Reqs (re-verified)</b><div class="val">${nf(prog.official_website_data.deep_recheck.language_requirements_verified)}</div></div>
          <div class="info-item"><b>Tuition/Fees (re-verified)</b><div class="val">${nf(prog.official_website_data.deep_recheck.tuition_and_fees_verified)}</div></div>
          <div class="info-item"><b>Deadlines (re-verified)</b><div class="val">${nf(prog.official_website_data.deep_recheck.deadlines_verified)}</div></div>
          <div class="info-item"><b>Required Documents</b><div class="val">${nf(prog.official_website_data.deep_recheck.required_documents)}</div></div>
          <div class="info-item"><b>Contact (re-verified)</b><div class="val">${nf(prog.official_website_data.deep_recheck.contact_info)}</div></div>
        </div>
        ${prog.official_website_data.deep_recheck.newly_found_info ? `<div style="font-size:.84rem;line-height:1.7;margin-bottom:8px;"><b>Newly found info:</b> ${prog.official_website_data.deep_recheck.newly_found_info}</div>` : ''}
        ${(prog.official_website_data.deep_recheck.corrections||[]).length ? `
        <div style="font-size:.82rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px;">Corrections found:</div>
        <ul style="padding-left:18px;margin:0 0 10px;font-size:.84rem;line-height:1.7;">
          ${prog.official_website_data.deep_recheck.corrections.map(c => '<li><b>' + c.field + ':</b> ' + c.corrected + ' <span style="color:var(--muted);">(was: ' + c.old + ')</span></li>').join('')}
        </ul>` : ''}
        ${prog.official_website_data.deep_recheck.notes ? `<div style="font-size:.8rem;color:var(--muted);line-height:1.6;">${prog.official_website_data.deep_recheck.notes}</div>` : ''}
        ${(prog.official_website_data.deep_recheck.sources_consulted||[]).length ? `
        <div style="margin-top:10px;font-size:.78rem;">
          <b>Pages consulted:</b> ${prog.official_website_data.deep_recheck.sources_consulted.map(u => '<a href="' + u + '" target="_blank" rel="noopener" style="color:var(--accent);margin-right:8px;">' + u.replace(/^https?:\/\//,'').slice(0,40) + '...</a>').join('')}
        </div>` : ''}
      </div>
      ` : ""}
${prog.official_website_data.gap_fill_pass ? `
      <div style="margin-top:16px;background:rgba(126,227,184,.05);border:1px solid rgba(126,227,184,.3);border-radius:10px;padding:14px;">
        <div style="font-weight:700;font-size:.85rem;margin-bottom:8px;">Targeted gap-filling pass (${prog.official_website_data.gap_fill_pass.checked_on}) - hunted for fields still missing after earlier passes</div>
        ${(prog.official_website_data.gap_fill_pass.fields_resolved||[]).length ? `
        <div style="font-size:.82rem;font-weight:700;color:var(--good);text-transform:uppercase;margin-bottom:6px;">Newly resolved:</div>
        <ul style="padding-left:18px;margin:0 0 10px;font-size:.84rem;line-height:1.7;">
          ${prog.official_website_data.gap_fill_pass.fields_resolved.map(f => '<li><b>' + f.field + ':</b> ' + f.value + (f.source_url ? ' <a href="' + f.source_url + '" target="_blank" rel="noopener" style="color:var(--accent);">[source]</a>' : '') + '</li>').join('')}
        </ul>` : '<div style="font-size:.84rem;color:var(--muted);margin-bottom:10px;">No additional fields resolved in this pass.</div>'}
        ${(prog.official_website_data.gap_fill_pass.fields_still_missing||[]).length ? `
        <details>
          <summary style="font-size:.8rem;cursor:pointer;color:var(--muted);">${prog.official_website_data.gap_fill_pass.fields_still_missing.length} field(s) genuinely not found after targeted search (click to see why)</summary>
          <ul style="padding-left:18px;margin:8px 0 0;font-size:.8rem;line-height:1.6;color:var(--muted);">
            ${prog.official_website_data.gap_fill_pass.fields_still_missing.map(f => '<li><b>' + f.field + ':</b> ' + f.attempt_note + '</li>').join('')}
          </ul>
        </details>` : ''}
      </div>
      ` : ""}
<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
        <a class="quick-btn" href="${prog.official_website_data.official_source_url}" target="_blank" rel="noopener">🌐 বিশ্ববিদ্যালয়ের মূল প্রোগ্রাম পেজ ↗</a>
        ${prog.official_website_data.official_spo_pdf ? `<a class="quick-btn" href="${prog.official_website_data.official_spo_pdf}" target="_blank" rel="noopener">📄 অফিশিয়াল পরীক্ষা নীতিমালা (SPO PDF) ↗</a>` : ""}
      </div>
    </div>
    ` : ""}

    <!-- Section: University Deep Info (Directly from University Official Website) -->
    ${prog.university_deep_info ? `
    <div class="section-block" id="sec-deep-official" style="border-top:2px solid var(--accent);padding-top:20px;margin-bottom:30px;">
      <div class="section-title" style="color:var(--accent);"><span class="icon">🔬</span> অফিসিয়াল বিশ্ববিদ্যালয় ডিপ-রিসার্চ ও ল্যাব ইনফো (Direct Official Site)</div>
      
      <div class="grid-info">
        <div class="info-item"><b>🏛️ চেয়ার ও ফ্যাকাল্টি লিডারশিপ</b><div class="val" style="color:var(--text);">${prog.university_deep_info.chair_leadership}</div></div>
        <div class="info-item"><b>🤝 ইন্ডাস্ট্রি ও রিসার্চ পার্টনারস</b><div class="val" style="color:var(--accent);">${prog.university_deep_info.research_partners}</div></div>
      </div>

      <div style="font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin:16px 0 6px;">🏭 Cleanroom ও ল্যাবরেটরি ইনফ্রাস্ট্রাকচার:</div>
      <div class="note-box good" style="font-size:.9rem;line-height:1.7;">${prog.university_deep_info.labs_infrastructure}</div>

      <div style="font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin:16px 0 6px;">📖 বিশেষায়িত কারিকুলাম মডিউল (Advanced Electives):</div>
      <ul style="padding-left:20px;margin:0 0 16px;font-size:.88rem;line-height:1.75;">
        ${(prog.university_deep_info.specialized_curriculum_modules || []).map(m => `<li><b>${m}</b></li>`).join('')}
      </ul>

      <div style="font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin:16px 0 6px;">🚀 ক্যারিয়ার ও ইন্ডাস্ট্রি ইকোসিস্টেম (Job Prospects):</div>
      <div class="longbox" style="border-left:3px solid var(--good);">${prog.university_deep_info.career_ecosystem}</div>

      ${prog.university_deep_info.official_syllabus_url ? `
        <div style="margin-top:14px;">
          <a class="quick-btn" href="${prog.university_deep_info.official_syllabus_url}" target="_blank" rel="noopener">📄 বিশ্ববিদ্যালয়ের মূল সিলেবাস ও কারিকুলাম ডকুমেন্ট ↗</a>
        </div>
      ` : ""}
    </div>
    ` : ""}

    <!-- Section 5: Services -->
    <div class="section-block" id="sec-services">
      <div class="section-title"><span><span class="icon">🏠</span> 5. Services & Student Life</span>${daadTag}</div>
      <div class="grid-info">
        <div class="info-item"><b>Accommodation Support</b><div class="val">${nf(s.accommodation)}</div></div>
        <div class="info-item"><b>Part-Time Work Opportunities</b><div class="val">${nf(s.part_time_work)}</div></div>
        <div class="info-item"><b>Career Services</b><div class="val">${nf(s.career_services)}</div></div>
        <div class="info-item"><b>International Student Support</b><div class="val">${nf(s.other_support)}</div></div>
      </div>
    </div>

    <!-- Section 6: About the University -->
    <div class="section-block" id="sec-about">
      <div class="section-title"><span><span class="icon">🏛️</span> 6. About the University & Contact Info</span>${daadTag}</div>
      <div class="grid-info">
        <div class="info-item"><b>Program Advisor / Contact</b><div class="val">${nf(a.contact_name)}</div></div>
        <div class="info-item"><b>Email</b><div class="val">${a.contact_email && a.contact_email!=='Not found' ? `<a href="mailto:${a.contact_email}" style="color:var(--accent);">${a.contact_email}</a>` : nf(a.contact_email)}</div></div>
        <div class="info-item"><b>Phone</b><div class="val">${nf(a.contact_phone)}</div></div>
        <div class="info-item"><b>Office Address</b><div class="val">${nf(a.contact_address)}</div></div>
        <div class="info-item"><b>Course Website</b><div class="val">${nf(a.course_website)}</div></div>
      </div>
      ${a.notes ? `<div class="note-box">🏛️ <b>বিশ্ববিদ্যালয় পরিচিতি ও নোট:</b> ${a.notes}</div>` : ""}
    </div>
  `;
}

function scrollToSection(secId){
  const el = document.getElementById(secId);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth' });
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
  }
}
</script>
</body>
</html>
