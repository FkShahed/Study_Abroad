<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program Details — Study in Germany</title>
<style>
:root{
  --bg:#0b0f19;
  --bg-gradient: radial-gradient(circle at 50% 0%, #17233f 0%, #0b0f19 75%);
  --panel: rgba(22, 29, 49, 0.72);
  --panel-solid: #151d30;
  --panel2: rgba(30, 41, 67, 0.65);
  --border: rgba(91, 140, 255, 0.16);
  --border-light: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(91, 140, 255, 0.45);
  --text: #f0f4fc;
  --muted: #9bb0d3;
  --accent: #5b8cff;
  --accent-glow: rgba(91, 140, 255, 0.25);
  --good: #38ef7d;
  --warn: #ffb74d;
  --bad: #ff5252;
  --radius: 16px;
  --radius-sm: 10px;
  --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  --backdrop: blur(14px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg: #f5f8ff;
    --bg-gradient: radial-gradient(circle at 50% 0%, #e2ecff 0%, #f5f8ff 75%);
    --panel: rgba(255, 255, 255, 0.82);
    --panel-solid: #ffffff;
    --panel2: rgba(238, 244, 255, 0.75);
    --border: rgba(53, 95, 214, 0.15);
    --border-light: rgba(0, 0, 0, 0.06);
    --border-hover: rgba(53, 95, 214, 0.4);
    --text: #172033;
    --muted: #5e6f8d;
    --accent: #2e62ea;
    --accent-glow: rgba(46, 98, 234, 0.18);
    --good: #00b862;
    --warn: #e67e22;
    --bad: #e74c3c;
    --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
  }
}
:root[data-theme="light"]{
  --bg: #f5f8ff;
  --bg-gradient: radial-gradient(circle at 50% 0%, #e2ecff 0%, #f5f8ff 75%);
  --panel: rgba(255, 255, 255, 0.82);
  --panel-solid: #ffffff;
  --panel2: rgba(238, 244, 255, 0.75);
  --border: rgba(53, 95, 214, 0.15);
  --border-light: rgba(0, 0, 0, 0.06);
  --border-hover: rgba(53, 95, 214, 0.4);
  --text: #172033;
  --muted: #5e6f8d;
  --accent: #2e62ea;
  --accent-glow: rgba(46, 98, 234, 0.18);
  --good: #00b862;
  --warn: #e67e22;
  --bad: #e74c3c;
  --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color:var(--text);
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  line-height:1.6;
  min-height: 100vh;
}
.container{max-width:95%;margin:0 auto;padding:26px 12px 80px;}
.top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.back{
  color:var(--accent);
  text-decoration:none;
  font-size:.88rem;
  font-weight:700;
  background: var(--panel);
  backdrop-filter: var(--backdrop);
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  box-shadow: var(--glass-shadow);
  transition: all .2s;
}
.back:hover{
  transform: translateX(-3px);
  border-color: var(--accent);
}
.themebtn{
  background:var(--panel);
  backdrop-filter: var(--backdrop);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 14px;
  border-radius:20px;
  font-size:.8rem;
  cursor:pointer;
  box-shadow: var(--glass-shadow);
}

.header-card{
  background:var(--panel);
  backdrop-filter: var(--backdrop);
  -webkit-backdrop-filter: var(--backdrop);
  border:1px solid var(--border);
  box-shadow: var(--glass-shadow);
  border-radius:var(--radius);
  padding:26px;
  margin-bottom:22px;
}
.uni{
  color:var(--accent);
  font-weight:800;
  font-size:.85rem;
  text-transform:uppercase;
  letter-spacing:.04em;
}
h1{
  font-size:1.65rem;
  font-weight: 800;
  margin:8px 0 16px;
  background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.tags{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.tag{
  font-size:.72rem;
  padding:5px 12px;
  border-radius:12px;
  font-weight:700;
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}
.tier-A{background:rgba(56,239,125,.16);color:var(--good);border:1px solid rgba(56,239,125,.3);}
.tier-B{background:rgba(255,183,77,.16);color:var(--warn);border:1px solid rgba(255,183,77,.3);}
.tier-C{background:rgba(155,176,211,.16);color:var(--muted);border:1px solid rgba(155,176,211,.25);}
.tier-D{background:rgba(91,140,255,.16);color:var(--accent);border:1px solid rgba(91,140,255,.3);}
.fit-good{background:rgba(56,239,125,.18);color:var(--good);border:1px solid rgba(56,239,125,.35);}
.fit-moderate,.fit-borderline{background:rgba(255,183,77,.18);color:var(--warn);border:1px solid rgba(255,183,77,.35);}
.fit-risky,.fit-weak{background:rgba(255,82,82,.18);color:var(--bad);border:1px solid rgba(255,82,82,.35);}
.fit-unknown,.fit-unclear{background:rgba(155,176,211,.16);color:var(--muted);border:1px solid rgba(155,176,211,.25);}

/* Section Navigation Tabs */
.tabs-nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding: 10px 4px 12px;
  margin-bottom:22px;
  position:sticky;
  top:0;
  background: transparent;
  z-index:10;
}
.tab-btn{
  background:var(--panel);
  backdrop-filter: var(--backdrop);
  border:1px solid var(--border);
  color:var(--text);
  padding:9px 16px;
  border-radius:14px;
  font-size:.82rem;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  transition:all .18s ease;
  box-shadow: var(--glass-shadow);
}
.tab-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
  transform: translateY(-2px);
}
.tab-btn.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
  box-shadow: 0 4px 14px var(--accent-glow);
}

/* Section Layout */
.section-block{
  background:var(--panel);
  backdrop-filter: var(--backdrop);
  -webkit-backdrop-filter: var(--backdrop);
  border:1px solid var(--border);
  box-shadow: var(--glass-shadow);
  border-radius:var(--radius);
  padding:24px;
  margin-bottom:24px;
  scroll-margin-top:76px;
}
.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:1.18rem;
  font-weight:800;
  color:var(--text);
  border-bottom:1px solid var(--border);
  padding-bottom:12px;
  margin-top:0;
  margin-bottom:18px;
}
.section-title span.icon{font-size:1.35rem;}

.grid-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px;}
.info-item{
  background:var(--panel2);
  border:1px solid var(--border-light);
  border-radius:var(--radius-sm);
  padding:12px 15px;
  transition: border-color .15s;
}
.info-item:hover{
  border-color: var(--border-hover);
}
.info-item b{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;font-weight:700;}
.info-item .val{font-size:.9rem;font-weight:600;}

.longbox{
  background:var(--panel2);
  border:1px solid var(--border-light);
  border-radius:var(--radius-sm);
  padding:16px 18px;
  font-size:.88rem;
  line-height:1.75;
  margin-bottom:14px;
  white-space:pre-line;
}
.longbox.empty{color:var(--muted);font-style:italic;}

.note-box{
  background:rgba(91,140,255,.1);
  border-left:4px solid var(--accent);
  padding:14px 18px;
  border-radius:8px;
  font-size:.88rem;
  line-height:1.65;
  margin-bottom:16px;
}
.note-box.fit{background:rgba(255,183,77,.1);border-left-color:var(--warn);}
.note-box.good{background:rgba(56,239,125,.1);border-left-color:var(--good);}

.quick-links{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
.quick-btn{
  background:var(--accent);
  color:#fff;
  text-decoration:none;
  padding:9px 18px;
  border-radius:12px;
  font-size:.85rem;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:6px;
  box-shadow: 0 4px 14px var(--accent-glow);
  transition: all .2s;
}
.quick-btn:hover{
  transform: translateY(-2px);
  box-shadow: 0 6px 20px var(--accent-glow);
}
.quick-btn.secondary{
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  box-shadow: var(--glass-shadow);
}
.quick-btn.secondary:hover{
  border-color: var(--accent);
  color: var(--accent);
}
</style>
</head>
<body>
<div class="container" id="root">
  <div style="padding:40px;text-align:center;">তথ্য লোড হচ্ছে...</div>
</div>

<script src="database.js"></script>
<script>
function toggleTheme(){
  const html=document.documentElement;
  html.setAttribute('data-theme', html.getAttribute('data-theme')==='light'?'dark':'light');
}

const params = new URLSearchParams(location.search);
const progId = params.get('id');
const paramIdx = parseInt(params.get('i'), 10);
const source = params.get('s');
const root = document.getElementById('root');

function nf(v){ return (v===undefined || v===null || v==="" || v==="Not found") ? "<span style='color:var(--muted);font-style:italic;'>Not found</span>" : v; }

// Single Source of Truth Resolution
let prog = null;
if (typeof DATABASE !== 'undefined' && DATABASE.programs) {
  if (progId) {
    prog = DATABASE.programs.find(p => p.id === progId);
  }
  if (!prog && source === 'daad') {
    prog = DATABASE.programs.find(p => p.daad_id == paramIdx) || DATABASE.programs[paramIdx];
  }
  if (!prog && !isNaN(paramIdx)) {
    prog = DATABASE.programs[paramIdx];
  }
}

if (!prog) {
  root.innerHTML = `
    <div class="top-nav"><a class="back" href="index.html">← মূল তালিকায় ফিরে যান</a></div>
    <div class="header-card"><h2>প্রোগ্রামটি পাওয়া যায়নি।</h2><p>দয়া করে তালিকা থেকে পুনরায় সিলেক্ট করুন।</p></div>
  `;
} else {
  const o = prog.overview || {};
  const c = prog.course_details || {};
  const f = prog.costs_funding || {};
  const r = prog.requirements_registration || {};
  const s = prog.services || {};
  const a = prog.about_university || {};

  const fitClass = prog.gpa_fit || "unknown";
  const fitTitles = {
    good: "✅ Good fit (যোগ্যতার সাথে দারুন ম্যাচ)",
    moderate: "🟡 Moderate (আবেদনযোগ্য)",
    borderline: "🟡 Borderline",
    risky: "🟠 Risky (কম্পিটিটিভ)",
    weak: "🔴 Weak (উচ্চ সিজিপিএ রিকোয়ার্ড)",
    unknown: "⚪ unreviewed (DAAD Raw)"
  };

  root.innerHTML = `
    <div class="top-nav">
      <a class="back" href="index.html">← মূল তালিকায় ফিরে যান</a>
      <button class="themebtn" onclick="toggleTheme()">🌓 Theme</button>
    </div>

    <div class="header-card">
      <div class="uni">${prog.university_name}</div>
      <h1>${prog.title}</h1>
      <div class="tags">
        <span class="tag tier-${prog.tier}">Tier ${prog.tier}</span>
        <span class="tag fit-${fitClass}">${fitTitles[fitClass] || fitClass}</span>
        <span class="tag" style="background:var(--panel2);border:1px solid var(--border);">${o.language || 'English'}</span>
        <span class="tag" style="background:var(--panel2);border:1px solid var(--border);">${f.tuition && f.tuition !== 'None' ? 'Tuition: ' + f.tuition : 'Tuition Free (০ ইউরো)'}</span>
      </div>

      ${prog.gpa_fit_note ? `<div class="note-box fit"><b>💡 আপনার প্রোফাইল ম্যাচ বিশ্লেষণ:</b> ${prog.gpa_fit_note}</div>` : ""}

      <div class="quick-links">
        ${a.course_website && a.course_website !== 'Not found' ? `<a class="quick-btn" href="${a.course_website.startsWith('http')?a.course_website:'https://'+a.course_website}" target="_blank" rel="noopener">🌐 অফিসিয়াল কোর্স ওয়েবসাইট ↗</a>` : ""}
        ${a.source_url && a.source_url.startsWith('http') ? `<a class="quick-btn secondary" href="${a.source_url}" target="_blank" rel="noopener">📄 DAAD অফিসিয়াল সোর্স ↗</a>` : ""}
        <a class="quick-btn secondary" href="profile.html">👤 আপনার ECTS ম্যাপিং দেখুন</a>
      </div>
    </div>

    <!-- Navigation Tabs for the 7 Core Sections -->
    <div class="tabs-nav">
      <button class="tab-btn active" onclick="scrollToSection('sec-overview')">📋 1. Overview</button>
      <button class="tab-btn" onclick="scrollToSection('sec-course')">📚 2. Course Details</button>
      <button class="tab-btn" onclick="scrollToSection('sec-req')">📝 3. Requirements & Entry</button>
      ${prog.university_deep_info ? `<button class="tab-btn" onclick="scrollToSection('sec-deep-official')" style="border-color:var(--good);color:var(--good);">🔬 4. University Deep Info (Official)</button>` : ""}
      <button class="tab-btn" onclick="scrollToSection('sec-costs')">💰 5. Costs / Funding</button>
      <button class="tab-btn" onclick="scrollToSection('sec-services')">🏠 6. Services</button>
      <button class="tab-btn" onclick="scrollToSection('sec-about')">🏛️ 7. About & Contact</button>
    </div>

    <!-- Section 1: Overview -->
    <div class="section-block" id="sec-overview">
      <div class="section-title"><span class="icon">📋</span> 1. Overview (সাধারণ পরিচিতি)</div>
      <div class="grid-info">
        <div class="info-item"><b>Degree Awarded</b><div class="val">${nf(o.degree_type)}</div></div>
        <div class="info-item"><b>Duration</b><div class="val">${nf(o.duration)}</div></div>
        <div class="info-item"><b>Teaching Language</b><div class="val">${nf(o.language)}</div></div>
        <div class="info-item"><b>Location / City</b><div class="val">${nf(o.location)}</div></div>
        <div class="info-item"><b>Department / Faculty</b><div class="val">${nf(o.department)}</div></div>
        <div class="info-item"><b>Intake Period</b><div class="val">${nf(o.intake)} (${o.has_winter?'Winter':''}${o.has_summer?', Summer':''})</div></div>
      </div>
    </div>

    <!-- Section 2: Course Details -->
    <div class="section-block" id="sec-course">
      <div class="section-title"><span class="icon">📚</span> 2. Course Details & Curriculum</div>
      <div class="grid-info">
        <div class="info-item"><b>Combined Master's / PhD</b><div class="val">${nf(c.combined_masters_phd)}</div></div>
        <div class="info-item"><b>Joint / Double Degree</b><div class="val">${nf(c.joint_double_degree)}</div></div>
        <div class="info-item"><b>Diploma Supplement</b><div class="val">${nf(c.diploma_supplement)}</div></div>
        <div class="info-item"><b>International Elements</b><div class="val">${nf(c.international_elements)}</div></div>
      </div>
      <div style="font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin:14px 0 6px;">Curriculum & Detailed Module Overview:</div>
      <div class="longbox ${(!c.curriculum || c.curriculum==='Not found')?'empty':''}">${nf(c.curriculum)}</div>
    </div>

    <!-- Section 3: Costs / Funding -->
    <div class="section-block" id="sec-costs">
      <div class="section-title"><span class="icon">💰</span> 3. Costs / Funding (ফি ও স্কলারশিপ)</div>
      <div class="grid-info">
        <div class="info-item"><b>Tuition Fee</b><div class="val" style="color:var(--good);">${nf(f.tuition)}</div></div>
        <div class="info-item"><b>Semester Contribution Fee</b><div class="val">${nf(f.semester_fee)}</div></div>
        <div class="info-item"><b>Cost of Living Estimate</b><div class="val">${nf(f.cost_of_living)}</div></div>
      </div>
      ${f.tuition_notes ? `<div class="note-box"><b>📌 টিউশন সংক্রান্ত নোট:</b> ${f.tuition_notes}</div>` : ""}
      <div style="font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin:14px 0 6px;">স্কলারশিপ ও ফান্ডিং সুযোগ:</div>
      <div class="longbox ${(!f.funding || f.funding==='Not found')?'empty':''}">${nf(f.funding)}</div>
    </div>

    <!-- Section 4: Requirements / Registration -->
    <div class="section-block" id="sec-req">
      <div class="section-title"><span class="icon">📝</span> 4. Requirements / Registration (ভর্তি ও ডেডলাইন)</div>
      <div class="grid-info">
        <div class="info-item"><b>Winter Intake Deadline</b><div class="val" style="color:var(--warn);">${nf(r.deadline_winter)}</div></div>
        <div class="info-item"><b>Summer Intake Deadline</b><div class="val">${nf(r.deadline_summer)}</div></div>
        <div class="info-item"><b>Submission Portal</b><div class="val">${nf(r.submission_portal)}</div></div>
        <div class="info-item"><b>Minimum GPA Threshold</b><div class="val">${nf(r.gpa_requirement)}</div></div>
        <div class="info-item"><b>Prerequisite Degree</b><div class="val">${nf(r.prerequisite_degree)}</div></div>
        <div class="info-item"><b>German Language Req</b><div class="val">${nf(r.german_requirement)}</div></div>
        <div class="info-item"><b>IELTS Academic Score</b><div class="val">${nf(r.ielts)}</div></div>
        <div class="info-item"><b>TOEFL iBT Score</b><div class="val">${nf(r.toefl)}</div></div>
        <div class="info-item"><b>GRE / GMAT Requirement</b><div class="val">${nf(r.gre)}</div></div>
        <div class="info-item"><b>APS Certificate</b><div class="val" style="color:var(--good);">${nf(r.aps_required)}</div></div>
      </div>
      <div style="font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin:14px 0 6px;">সম্পূর্ণ একাডেমিক রিকোয়ারমেন্টস:</div>
      <div class="longbox ${(!r.academic_requirements || r.academic_requirements==='Not found')?'empty':''}">${nf(r.academic_requirements)}</div>
      ${r.work_exp_note ? `<div class="note-box good">💼 <b>কাজের অভিজ্ঞতা সংক্রান্ত নোট:</b> ${r.work_exp_note}</div>` : ""}
    </div>

    <!-- Section: University Deep Info (Directly from University Official Website) -->
    ${prog.university_deep_info ? `
    <div class="section-block" id="sec-deep-official" style="border:1.5px solid var(--accent);box-shadow:0 8px 30px rgba(91,140,255,.18);">
      <div class="section-title" style="color:var(--good);"><span class="icon">🔬</span> অফিসিয়াল বিশ্ববিদ্যালয় ডিপ-রিসার্চ ও ল্যাব ইনফো (Direct Official Site)</div>
      
      <div class="grid-info">
        <div class="info-item"><b>🏛️ চেয়ার ও ফ্যাকাল্টি লিডারশিপ</b><div class="val" style="color:var(--text);">${prog.university_deep_info.chair_leadership}</div></div>
        <div class="info-item"><b>🤝 ইন্ডাস্ট্রি ও রিসার্চ পার্টনারস</b><div class="val" style="color:var(--accent);">${prog.university_deep_info.research_partners}</div></div>
      </div>

      <div style="font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin:16px 0 6px;">🏭 Cleanroom ও ল্যাবরেটরি ইনফ্রাস্ট্রাকচার:</div>
      <div class="note-box good" style="font-size:.9rem;line-height:1.7;">${prog.university_deep_info.labs_infrastructure}</div>

      <div style="font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin:16px 0 6px;">📖 বিশেষায়িত কারিকুলাম মডিউল (Advanced Electives):</div>
      <ul style="padding-left:20px;margin:0 0 16px;font-size:.88rem;line-height:1.75;">
        ${(prog.university_deep_info.specialized_curriculum_modules || []).map(m => `<li><b>${m}</b></li>`).join('')}
      </ul>

      <div style="font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin:16px 0 6px;">🚀 ক্যারিয়ার ও ইন্ডাস্ট্রি ইকোসিস্টেম (Job Prospects):</div>
      <div class="longbox" style="border-left:3px solid var(--good);">${prog.university_deep_info.career_ecosystem}</div>

      ${prog.university_deep_info.official_syllabus_url ? `
        <div style="margin-top:14px;">
          <a class="quick-btn" href="${prog.university_deep_info.official_syllabus_url}" target="_blank" rel="noopener">📄 বিশ্ববিদ্যালয়ের মূল সিলেবাস ও কারিকুলাম ডকুমেন্ট ↗</a>
        </div>
      ` : ""}
    </div>
    ` : ""}

    <!-- Section 5: Services -->
    <div class="section-block" id="sec-services">
      <div class="section-title"><span class="icon">🏠</span> 5. Services & Student Life</div>
      <div class="grid-info">
        <div class="info-item"><b>Accommodation Support</b><div class="val">${nf(s.accommodation)}</div></div>
        <div class="info-item"><b>Part-Time Work Opportunities</b><div class="val">${nf(s.part_time_work)}</div></div>
        <div class="info-item"><b>Career Services</b><div class="val">${nf(s.career_services)}</div></div>
        <div class="info-item"><b>International Student Support</b><div class="val">${nf(s.other_support)}</div></div>
      </div>
    </div>

    <!-- Section 6: About the University -->
    <div class="section-block" id="sec-about">
      <div class="section-title"><span class="icon">🏛️</span> 6. About the University & Contact Info</div>
      <div class="grid-info">
        <div class="info-item"><b>Program Advisor / Contact</b><div class="val">${nf(a.contact_name)}</div></div>
        <div class="info-item"><b>Email</b><div class="val">${a.contact_email && a.contact_email!=='Not found' ? `<a href="mailto:${a.contact_email}" style="color:var(--accent);">${a.contact_email}</a>` : nf(a.contact_email)}</div></div>
        <div class="info-item"><b>Phone</b><div class="val">${nf(a.contact_phone)}</div></div>
        <div class="info-item"><b>Office Address</b><div class="val">${nf(a.contact_address)}</div></div>
        <div class="info-item"><b>Course Website</b><div class="val">${nf(a.course_website)}</div></div>
      </div>
      ${a.notes ? `<div class="note-box">🏛️ <b>বিশ্ববিদ্যালয় পরিচিতি ও নোট:</b> ${a.notes}</div>` : ""}
    </div>
  `;
}

function scrollToSection(secId){
  const el = document.getElementById(secId);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth' });
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
  }
}
</script>
</body>
</html>
